version: '3.8'

services:
  cache-server:
    build: .
    ports:
      - "${TCP_PORT:-6379}:${TCP_PORT:-6379}"  # TCP cache protocol
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"  # HTTP REST API
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${HTTP_PORT:-8080}${HEALTH_ENDPOINT:-/health}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

networks:
  default:
    driver: bridge